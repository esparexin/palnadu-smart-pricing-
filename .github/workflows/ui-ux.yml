name: UI/UX & Accessibility Standards

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-ux:
    name: UI/UX and accessibility quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.2.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate UI/UX and frontend standards
        run: |
          if [ -d "apps/web" ]; then
            echo "Validating UI/UX standards for apps/web..."
            pnpm --filter @palnadu/contracts build
            pnpm --filter @palnadu/web lint
            pnpm --filter @palnadu/web build
            pnpm --filter @palnadu/web test
          else
            echo "Phase 2-4 foundation active: no public or admin UI packages currently present in the monorepo."
            echo "UI/UX, accessibility, and responsive checks will activate automatically once apps/web is introduced."
          fi
