services:
  - type: web
    name: palnadu-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @palnadu/server-config build && pnpm --filter @palnadu/contracts build && pnpm --filter @palnadu/persistence build && pnpm --filter @palnadu/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3001
      - key: LOG_LEVEL
        value: info
      - key: DB_POOL_MAX
        value: 5
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: DB_SSL
        value: require
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_TTL_HOURS
        value: 12
      - key: ALLOWED_ORIGINS
        sync: false
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STOREFRONT_REVALIDATE_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
